name: Build and Release

on:
  schedule:
    - cron: '0 4 * * *'   # once a day (04:00 UTC); only builds if main has new commits
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether a build is needed. Manual runs and tag pushes always build;
  # the daily scheduled run only builds when main has moved since the last
  # 'latest' release, so we get at most one rolling build per day.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Decide whether to build
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event '${{ github.event_name }}' -> always build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="${{ github.sha }}"
          last="$(gh api "repos/${{ github.repository }}/git/ref/tags/latest" \
                   --jq '.object.sha' 2>/dev/null || echo '')"
          echo "current HEAD: $head"
          echo "latest build: ${last:-<none>}"
          if [ "$head" != "$last" ]; then
            echo "New commits since the last build -> building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits since the last build -> skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download BASS libraries
        shell: pwsh
        run: |
          $libs = @(
            @{ name = "bass";    url = "https://www.un4seen.com/files/bass24.zip" },
            @{ name = "bass_fx"; url = "https://www.un4seen.com/files/z/0/bass_fx24.zip" },
            @{ name = "bassenc"; url = "https://www.un4seen.com/files/bassenc24.zip" }
          )
          foreach ($lib in $libs) {
            Invoke-WebRequest -Uri $lib.url -OutFile "$($lib.name).zip" -UserAgent "Mozilla/5.0"
            Expand-Archive -Path "$($lib.name).zip" -DestinationPath "$($lib.name)" -Force
          }

      - name: Copy headers, libs and DLLs
        shell: pwsh
        run: |
          # bass
          Copy-Item bass\c\bass.h         -Destination .
          Copy-Item bass\c\x64\bass.lib   -Destination .
          Copy-Item bass\x64\bass.dll     -Destination .

          # bass_fx
          Copy-Item bass_fx\c\bass_fx.h        -Destination .
          Copy-Item bass_fx\c\x64\bass_fx.lib  -Destination .
          Copy-Item bass_fx\x64\bass_fx.dll    -Destination .

          # bassenc
          Copy-Item bassenc\c\bassenc.h        -Destination .
          Copy-Item bassenc\c\x64\bassenc.lib  -Destination .
          Copy-Item bassenc\x64\bassenc.dll    -Destination .

      # Optional format plugins offered by the installer. Only the x64 DLL is
      # needed - they are loaded at run time with BASS_PluginLoad, so there is
      # nothing to link against.
      - name: Download BASS plugins
        shell: pwsh
        run: |
          $plugins = @(
            @{ name = "bassopus"; url = "https://www.un4seen.com/files/bassopus24.zip" },
            @{ name = "bassflac"; url = "https://www.un4seen.com/files/bassflac24.zip" },
            @{ name = "bassalac"; url = "https://www.un4seen.com/files/bassalac24.zip" },
            @{ name = "basswv";   url = "https://www.un4seen.com/files/basswv24.zip" },
            @{ name = "bassape";  url = "https://www.un4seen.com/files/bassape24.zip" },
            @{ name = "bassdsd";  url = "https://www.un4seen.com/files/bassdsd24.zip" },
            @{ name = "bass_aac"; url = "https://www.un4seen.com/files/z/2/bass_aac24.zip" },
            @{ name = "bass_spx"; url = "https://www.un4seen.com/files/z/2/bass_spx24.zip" }
          )
          New-Item -ItemType Directory -Path plugins | Out-Null
          foreach ($p in $plugins) {
            $dir = "plugin_$($p.name)"
            Invoke-WebRequest -Uri $p.url -OutFile "$dir.zip" -UserAgent "Mozilla/5.0"
            Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
            # locate the 64-bit build rather than assuming the layout of each zip
            $dll = Get-ChildItem -Path $dir -Recurse -Filter "$($p.name).dll" |
                   Where-Object { $_.DirectoryName -match '\\x64$' } |
                   Select-Object -First 1
            if (-not $dll) {
              Get-ChildItem -Path $dir -Recurse -Filter *.dll | ForEach-Object { Write-Host "  found: $($_.FullName)" }
              throw "no x64 $($p.name).dll in $($p.url) - see the .dll list above"
            }
            Copy-Item $dll.FullName -Destination plugins\
          }
          Get-ChildItem plugins | Select-Object Name, Length | Format-Table -AutoSize

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            # no leading zeros: 08/09 would be invalid octal in FILEVERSION
            $ver = Get-Date -Format 'yyyy.M.d'
          }
          "APPVERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: cmd
        run: build.bat

      - name: Render README to HTML
        shell: pwsh
        run: |
          $body = (ConvertFrom-Markdown -Path README.md).Html
          $html = @"
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>BASS PlAIer</title>
          <style>
            body { font-family: system-ui, sans-serif; line-height: 1.6;
                   max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
            code { background: #f0f0f0; padding: .1em .3em; border-radius: 3px; }
            pre { background: #f0f0f0; padding: 1rem; border-radius: 6px; overflow-x: auto; }
            pre code { background: none; padding: 0; }
            table { border-collapse: collapse; }
            th, td { border: 1px solid #ccc; padding: .3em .6em; text-align: left; }
            blockquote { border-left: 4px solid #ccc; margin: 1em 0; padding: .1em 1em; color: #555; }
          </style>
          </head>
          <body>
          $body
          </body>
          </html>
          "@
          Set-Content -Path README.html -Value $html -Encoding utf8

      - name: Stage and zip release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item BASSPlAIer.exe, bass.dll, bass_fx.dll, bassenc.dll, README.html -Destination release\
          # the zip gets every plugin; the installer offers them one by one
          Copy-Item plugins -Destination release\ -Recurse
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $zip = "BASSPlAIer-$env:GITHUB_REF_NAME-x64.zip"
          } else {
            $zip = "BASSPlAIer-x64.zip"
          }
          Compress-Archive -Path release\* -DestinationPath $zip
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $out = "BASSPlAIer-$env:GITHUB_REF_NAME-Setup.exe"
          } else {
            $out = "BASSPlAIer-Setup.exe"
          }
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DAPPVERSION=$env:APPVERSION" "/DOUTFILE=$out" installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          "SETUP_NAME=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # installer.ico must stay a single-image icon: MUI's default carries 7,
      # and nothing in the build would otherwise notice it creeping back.
      - name: Verify the installer carries a single icon
        shell: pwsh
        run: |
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Res {
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint flags);
              [DllImport("kernel32.dll")] public static extern bool FreeLibrary(IntPtr h);
              public delegate bool Cb(IntPtr m, IntPtr t, IntPtr n, IntPtr p);
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern bool EnumResourceNames(IntPtr m, IntPtr t, Cb cb, IntPtr p);
              public static int Count(string file, int type) {
                  int n = 0;
                  IntPtr h = LoadLibraryEx(file, IntPtr.Zero, 0x00000002);   // AS_DATAFILE
                  if (h == IntPtr.Zero) throw new Exception("LoadLibraryEx failed on " + file);
                  try { EnumResourceNames(h, new IntPtr(type), (a,b,c,d) => { n++; return true; }, IntPtr.Zero); }
                  finally { FreeLibrary(h); }
                  return n;
              }
          }
          "@
          $icons  = [Res]::Count((Resolve-Path $env:SETUP_NAME).Path, 3)    # RT_ICON
          $groups = [Res]::Count((Resolve-Path $env:SETUP_NAME).Path, 14)   # RT_GROUP_ICON
          Write-Host "$env:SETUP_NAME -> RT_ICON=$icons RT_GROUP_ICON=$groups"
          if ($icons -ne 1 -or $groups -ne 1) {
            throw "Expected exactly one icon image (RT_ICON=1, RT_GROUP_ICON=1) but found RT_ICON=$icons, RT_GROUP_ICON=$groups"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASSPlAIer-x64
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}

      # --- Rolling "latest" prerelease (daily, when main has new commits) ---
      - name: Delete previous latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: gh release delete latest --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish latest (rolling prerelease)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Development Build
          prerelease: true
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}

      # --- Proper release when a v* tag is pushed ---
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.SETUP_NAME }}
          generate_release_notes: true

  # 32-bit build targeting PE subsystem 4.0 (Windows 95 / NT 4.0). MSVC cannot
  # emit a subsystem below 5.01 - it discards the value with LNK4010 - so this
  # uses MinGW-w64's i686 gcc. Kept as its own job on purpose: it runs after the
  # x64 release is already published and only adds its asset to it, so a failure
  # here can never take that release down with it.
  build32:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install the i686 MinGW toolchain
        shell: pwsh
        run: |
          if (-not (Test-Path C:\msys64\usr\bin\pacman.exe)) { throw "MSYS2 not found at C:\msys64 on this runner" }
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-i686-gcc
          if ($LASTEXITCODE -ne 0) { throw "pacman failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path C:\msys64\mingw32\bin\gcc.exe)) { throw "no i686 gcc after install" }
          & C:\msys64\mingw32\bin\gcc.exe -dumpmachine
          & C:\msys64\mingw32\bin\gcc.exe --version

      - name: Download 32-bit BASS libraries and plugins
        shell: pwsh
        run: |
          # Same zips as the x64 job; the 32-bit DLLs are the ones NOT in the
          # x64 subfolder, so pick by excluding that rather than by guessing.
          function Get-Dll32($dir, $name) {
            $dll = Get-ChildItem -Path $dir -Recurse -Filter "$name.dll" |
                   Where-Object { $_.DirectoryName -notmatch '\\(x64|arm|arm64)$' } |
                   Select-Object -First 1
            if (-not $dll) {
              Get-ChildItem -Path $dir -Recurse -Filter *.dll | ForEach-Object { Write-Host "  found: $($_.FullName)" }
              throw "no 32-bit $name.dll in $dir - see the .dll list above"
            }
            return $dll.FullName
          }

          $libs = @(
            @{ name = "bass";    url = "https://www.un4seen.com/files/bass24.zip" },
            @{ name = "bass_fx"; url = "https://www.un4seen.com/files/z/0/bass_fx24.zip" },
            @{ name = "bassenc"; url = "https://www.un4seen.com/files/bassenc24.zip" }
          )
          foreach ($l in $libs) {
            Invoke-WebRequest -Uri $l.url -OutFile "$($l.name).zip" -UserAgent "Mozilla/5.0"
            Expand-Archive -Path "$($l.name).zip" -DestinationPath $l.name -Force
            Copy-Item (Get-Dll32 $l.name $l.name) -Destination .
            Copy-Item "$($l.name)\c\$($l.name).h" -Destination .
          }

          $plugins = @(
            @{ name = "bassopus"; url = "https://www.un4seen.com/files/bassopus24.zip" },
            @{ name = "bassflac"; url = "https://www.un4seen.com/files/bassflac24.zip" },
            @{ name = "bassalac"; url = "https://www.un4seen.com/files/bassalac24.zip" },
            @{ name = "basswv";   url = "https://www.un4seen.com/files/basswv24.zip" },
            @{ name = "bassape";  url = "https://www.un4seen.com/files/bassape24.zip" },
            @{ name = "bassdsd";  url = "https://www.un4seen.com/files/bassdsd24.zip" },
            @{ name = "bass_aac"; url = "https://www.un4seen.com/files/z/2/bass_aac24.zip" },
            @{ name = "bass_spx"; url = "https://www.un4seen.com/files/z/2/bass_spx24.zip" }
          )
          New-Item -ItemType Directory -Path plugins | Out-Null
          foreach ($p in $plugins) {
            $dir = "plugin_$($p.name)"
            Invoke-WebRequest -Uri $p.url -OutFile "$dir.zip" -UserAgent "Mozilla/5.0"
            Expand-Archive -Path "$dir.zip" -DestinationPath $dir -Force
            Copy-Item (Get-Dll32 $dir $p.name) -Destination plugins\
          }

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $ver = Get-Date -Format 'yyyy.M.d'
          }
          "APPVERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: cmd
        run: |
          set PATH=C:\msys64\mingw32\bin;%PATH%
          call build32.bat
          if errorlevel 1 exit /b 1

      - name: Verify it is 32-bit with subsystem 4.0
        shell: pwsh
        run: |
          $exe = (Resolve-Path BASSPlAIer.exe).Path
          $b = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToUInt32($b, 0x3C)
          if ($b[$pe] -ne 0x50 -or $b[$pe+1] -ne 0x45) { throw "not a PE file" }
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          $opt     = $pe + 24
          # the fields from offset 40 on sit in the same place in PE32 and PE32+
          $subMaj  = [BitConverter]::ToUInt16($b, $opt + 48)
          $subMin  = [BitConverter]::ToUInt16($b, $opt + 50)
          Write-Host ("$([IO.Path]::GetFileName($exe)): machine=0x{0:X4} subsystem version={1}.{2} size={3} bytes" -f $machine, $subMaj, $subMin, $b.Length)
          if ($machine -ne 0x014c) { throw "expected i386 (0x014C) but got 0x$('{0:X4}' -f $machine)" }
          if ($subMaj -ne 4 -or $subMin -ne 0) { throw "expected subsystem version 4.0 but got $subMaj.$subMin" }

          # --gc-sections drops sections nothing references, and no code
          # references the version resource - make sure it is still there.
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class Res32 {
              [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)]
              public static extern IntPtr LoadLibraryEx(string f, IntPtr h, uint flags);
              [DllImport("kernel32.dll")] public static extern bool FreeLibrary(IntPtr h);
              public delegate bool Cb(IntPtr m, IntPtr t, IntPtr n, IntPtr p);
              [DllImport("kernel32.dll", SetLastError=true)]
              public static extern bool EnumResourceNames(IntPtr m, IntPtr t, Cb cb, IntPtr p);
              public static int Count(string file, int type) {
                  int n = 0;
                  IntPtr h = LoadLibraryEx(file, IntPtr.Zero, 0x00000002);   // AS_DATAFILE
                  if (h == IntPtr.Zero) throw new Exception("LoadLibraryEx failed on " + file);
                  try { EnumResourceNames(h, new IntPtr(type), (a,b,c,d) => { n++; return true; }, IntPtr.Zero); }
                  finally { FreeLibrary(h); }
                  return n;
              }
          }
          "@
          $ver = [Res32]::Count($exe, 16)   # RT_VERSION
          Write-Host "RT_VERSION resources: $ver"
          if ($ver -lt 1) { throw "the version resource did not survive --gc-sections" }

      - name: Zip the 32-bit build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release32 | Out-Null
          Copy-Item BASSPlAIer.exe, bass.dll, bass_fx.dll, bassenc.dll -Destination release32\
          Copy-Item plugins -Destination release32\ -Recurse
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $zip = "BASSPlAIer-$env:GITHUB_REF_NAME-x86.zip"
          } else {
            $zip = "BASSPlAIer-x86.zip"
          }
          Compress-Archive -Path release32\* -DestinationPath $zip
          "ZIP32_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload the 32-bit artifact
        uses: actions/upload-artifact@v4
        with:
          name: BASSPlAIer-x86
          path: ${{ env.ZIP32_NAME }}

      # The x64 job has already created the release; only add our asset to it.
      # 'gh release upload' touches nothing else, so the notes it generated and
      # the files it attached are left exactly as they are.
      - name: Attach the 32-bit zip to the release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="latest"
          fi
          gh release upload "$tag" "$ZIP32_NAME" --clobber
